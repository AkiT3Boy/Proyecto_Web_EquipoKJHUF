services:
  - type: web
    name: k-jhuf-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false

  - type: static
    name: k-jhuf-frontend
    rootDir: k-jhuf-web
    buildCommand: npm install && npm run build:render
    staticPublishPath: dist/k-jhuf-web
    envVars:
      - key: API_URL
        sync: false
